[package]
name = "sherlog-cli"
version = "0.6.2"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/catoncat/sherlog"
description = "Standalone Rust CLI for Sherlog"

[[bin]]
name = "shlog"
path = "src/main.rs"

[dependencies]
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
hex = "0.4"
jiff = { version = "0.2", features = ["serde"] }
memchr = "2.7"
rayon = "1.11"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
unicode-script = "0.5.8"
unicode-segmentation = "1.13.3"
walkdir = "2.5"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
